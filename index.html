<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Blog Tech</title>

    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin: 0;
        }

        main {
            background-color: white;
            width: 70%;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #0066cc;
        }

        h2 {
            color: #0066cc;
        }

        p {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu Blog Tech</h1>
        <p>Compartilhando conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Foto de perfil">

        <h2>Meu Primeiro Post</h2>

        <p>Por: Marcelo Paudetto</p>

        <p>
            Bem-vindo ao meu blog! Aqui vou compartilhar dicas de
            programação, tecnologia e curiosidades do mundo digital.
        </p>
    </main>

</body>
</html>
